# Build the pkgdown site and publish it to GitHub Pages.
#
# Pages must be pointed at the `gh-pages` branch once, in
# Settings → Pages → Source: "Deploy from a branch" → gh-pages / (root).

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown

permissions: read-all

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    permissions:
      contents: write
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # The prediction step runs through reticulate. Installing the Python side
      # lets the bulk vignette render real numbers instead of the "skipped"
      # placeholder; it degrades gracefully if anything here fails.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r inst/python/requirements.txt
          echo "RETICULATE_PYTHON=$(which python)" >> $GITHUB_ENV

      # Suggests are skipped on purpose: Seurat and SeuratDisk are only used by
      # the single-cell vignette, whose chunks are eval = FALSE, and SeuratDisk
      # is not on CRAN.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, any::knitr, any::rmarkdown, local::.
          dependencies: '"hard"'
          needs: website

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          clean: false
          branch: gh-pages
          folder: docs
